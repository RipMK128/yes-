name: Build EclipsePowers

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare plugin files
        run: |
          mkdir -p src/main/java/dev/smp/eclipsepowers src/main/resources
          cp ./*.java src/main/java/dev/smp/eclipsepowers/
          cat > src/main/resources/plugin.yml <<'EOF'
          name: EclipsePowers
          version: 1.2.0
          main: dev.smp.eclipsepowers.EclipsePowers
          api-version: '1.21'
          commands:
            power:
              description: View and manage powers
          permissions:
            eclipsepowers.use:
              default: true
            eclipsepowers.admin:
              default: op
          EOF
          cat > src/main/resources/config.yml <<'EOF'
          kills-to-unlock: 5
          count-mob-kills: false
          assign-on-join: true
          roll-delay-seconds: 5
          target-mode: hostile
          particle-density: 1.0
          aura: true
          aura-style: fancy
          true-damage: true
          EOF

      - name: Build JAR
        run: mvn --batch-mode package

      - uses: actions/upload-artifact@v4
        with:
          name: EclipsePowers
          path: target/EclipsePowers.jar
